<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tools | RecipeScale Lab</title><link rel="stylesheet" href="assets/styles.css"></head><body><header><div class="wrap nav"><a class="brand" href="index.html">RecipeScale Lab</a><a href="contact.html">Contact</a></div></header><main class="wrap section"><h1>Free RecipeScale Lab Tools</h1><div class="tools"><div class="tool"><h3>Quick Planner</h3><input id="t1" placeholder="Add a task"><button onclick="addTask()">Add</button><div id="r1" class="result"></div></div><div class="tool"><h3>Checklist Builder</h3><textarea id="t2" rows="7" placeholder="One item per line"></textarea><button onclick="build()">Build checklist</button><div id="r2" class="result"></div></div></div></main><script>let a=[];function addTask(){if(t1.value.trim())a.push(t1.value.trim());t1.value='';r1.textContent=a.map((x,i)=>(i+1)+'. '+x).join('\n')}function build(){r2.innerHTML=t2.value.split('\n').filter(Boolean).map(x=>'□ '+x).join('<br>')}</script></body></html>
